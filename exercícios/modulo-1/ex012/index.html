<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos em HTML</title>
</head>
<body>
    <h1>Vídeos em HTML</h1>

    <h2>Vídeos Locais</h2>
    <p>Este vídeo está hospedado localmente</p>

    <video width="560" poster="images/limoes-capa.png" controls>
        <source src="media/meu-video-mp4.mp4" type="video/mp4">
        <source src="media/meu-video-webm.webm" type="video/webm">
        <p>Infelizmente, o seu navegador não tem compatibilidade com esse arquivo</p>
    </video>

    <h2>Hospedagem Externa</h2>
    <p>Esse vídeo tá hospedado no Youtube</p>
    <iframe 
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/ysoGXrk6UvU" 
        title="YouTube video player" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen>
    </iframe>

    <p>Esse vídeo tá hospedado no Vimeo</p>
    <iframe 
        src="https://player.vimeo.com/video/1148137257?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" 
        width="560" 
        height="315" 
        frameborder="0" 
        allow="autoplay; fullscreen" 
        allowfullscreen>
    </iframe>
</body>
</html>
