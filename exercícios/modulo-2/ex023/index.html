<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Elementos</title>
    <style>
        p::before{
            content: '=> ';
        }

        p::after{
            content: ' <=';
        }
    </style>
</head>
<body>
    <h1>Pseudo-Elementos em CSS</h1>
    <p>Isso é algo importante, vou colocar uns indicadores</p>
</body>
</html>
